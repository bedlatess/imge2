services:
  astraforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: astraforge-ai-image-studio:latest
    restart: unless-stopped
    ports:
      - "12001:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      CORS_ORIGIN: http://localhost:12001
      OPENAI_IMAGE_BASE_URL: https://api.openai.com/v1
      OPENAI_IMAGE_MODEL: gpt-image-2
      SESSION_TTL_HOURS: 168
      MAX_UPLOAD_MB: 20
      UPSTREAM_TIMEOUT_SECONDS: 90
      APP_ENCRYPTION_SECRET: ${APP_ENCRYPTION_SECRET:-replace-with-a-long-random-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
